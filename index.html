<!DOCTYPE html>
<html lang="en">

<head>
  <title>Google Clone</title>
  <link rel="icon" href="./images/favicon.png" />
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/b0f29e9bfe.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>

<body>
  <section class="content-section">
    <div class="content-wrapper">
      <img class="logo-img" src="./images/logo.jpg" alt="Google Logo" />
      <div class="search-bar" id="search-bar">
        <i class="fas fa-search"></i>
        <input id="search-input" class="search-input" type="text" />
        <i class="fas fa-keyboard"></i>
        <i class="fas fa-microphone"></i>
      </div>
      <div class="search-btns">
        <button id="google-search-btn" class="google-search-btn">
          Google Search
        </button>
        <button class="lucky-search-btn">I'm Feeling Lucky</button>
      </div>
    </div>
  </section>

  <section id="results-section"></section>

  <div class="pagination" id="pagination">
    <button id="prev-btn" style="display: none;">Previous</button>
    <button id="next-btn" style="display: none;">Next</button>
  </div>

  <div class="floating-buttons">
    <a href="https://github.com/Ashish-suman-sharma/google-app" target="_blank" class="floating-btn github-btn" title="View GitHub Repository">
        <div class="btn-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.30 3.297-1.30.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/>
            </svg>
        </div>
        <span class="btn-text">GitHub</span>
    </a>
    <a href="https://ashishsuman.in" target="_blank" class="floating-btn website-btn" title="Visit My Website">
        <div class="btn-icon">
            <img src="./images/1687891321401.png" alt="Ashish Suman" class="profile-img">
        </div>
        <span class="btn-text">Portfolio</span>
    </a>
  </div>

  <script src="./main.js"></script>
</body>

</html>
